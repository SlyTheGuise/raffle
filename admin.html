<!DOCTYPE html>
<html>
<head>
  <title>Admin Spin</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
</head>
<body>
  <h2>Admin Panel</h2>
  <button onclick="spin()">Spin the Wheel</button>
  <div id="status"></div>

  <script>
    function spin() {
      db.ref("contestants").once("value", snapshot => {
        const data = snapshot.val();
        const entries = Object.values(data);
        if (entries.length < 2) {
          alert("Need at least 2 contestants.");
          return;
        }
        const winner = entries[Math.floor(Math.random() * entries.length)];
        db.ref("winner").set(winner);
        document.getElementById("status").innerText = `Winner: ${winner.name}`;
      });
    }
  </script>
</body>
</html>
