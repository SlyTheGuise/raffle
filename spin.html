<!DOCTYPE html>
<html>
<head>
  <title>Live Spin</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <style>
    body { text-align: center; }
    #wheel { width: 300px; height: 300px; border-radius: 50%; margin: auto; border: 5px solid #333; }
    .winner { font-size: 1.5em; color: green; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Live Raffle Spin</h2>
  <div id="wheel"></div>
  <div class="winner" id="winner"></div>

 <script>
  const joined = localStorage.getItem("joinedName");
  if (joined) {
    alert(`🎉 Congratulations ${joined}! You've been entered into the draw.`);
    localStorage.removeItem("joinedName");
  }
</script>
</body>
</html>
