<!DOCTYPE html>
<html>
<head>
  <title>Live Spin</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <style>
    body { text-align: center; }
    #wheel { width: 300px; height: 300px; border-radius: 50%; margin: auto; border: 5px solid #333; }
    .winner { font-size: 1.5em; color: green; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Live Raffle Spin</h2>
  <div id="wheel"></div>
  <div class="winner" id="winner"></div>

  <script>
    function renderWheel(contestants) {
      const wheel = document.getElementById('wheel');
      wheel.innerHTML = '';
      contestants.forEach((c, i) => {
        const seg = document.createElement('div');
        seg.innerText = c.name;
        seg.style.background = ['#f33','#3f3','#33f'][i % 3];
        seg.style.padding = '10px';
        seg.style.margin = '5px';
        wheel.appendChild(seg);
      });
    }

    db.ref("contestants").on("value", snapshot => {
      const data = snapshot.val();
      if (!data) return;
      const entries = Object.values(data);
      renderWheel(entries);
    });

    db.ref("winner").on("value", snap => {
      const val = snap.val();
      if (val) {
        document.getElementById("winner").innerText = `🎉 Winner: ${val.name} 🎉`;
        alert(`🎉 ${val.name} has won the raffle!`);
      }
    });
  </script>
</body>
</html>
