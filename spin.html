<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <title>Raffle Spin</title>

  <style>

    body {

      background: #f0f2f5;

      margin: 0;

      font-family: sans-serif;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 100vh;

    }

    #wheel {

      width: 400px;

      height: 400px;

      border: 8px solid #333;

      border-radius: 50%;

      margin: 20px 0;

      transition: transform 5s ease-out;

      position: relative;

    }

    .segment {

      position: absolute;

      width: 50%;

      height: 50%;

      top: 0;

      left: 50%;

      transform-origin: 0% 100%;

      text-align: right;

      padding-right: 20px;

      font-weight: bold;

      color: white;

    }

    .pointer {

      width: 0;

      height: 0;

      border-left: 15px solid transparent;

      border-right: 15px solid transparent;

      border-bottom: 30px solid red;

      position: absolute;

      top: -30px;

      left: calc(50% - 15px);

    }

    button {

      background: #007bff;

      color: white;

      font-size: 1.1rem;

      padding: 12px 30px;

      border: none;

      border-radius: 5px;

      cursor: pointer;

    }

    button:disabled {

      background: #aaa;

      cursor: not-allowed;

    }

    #winner {

      margin-top: 20px;

      font-size: 1.4rem;

      color: green;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <h2>Spin the Wheel!</h2>

  <div class="pointer"></div>

  <div id="wheel"></div>

  <button id="spin-btn">Spin</button>

  <div id="winner"></div>



  <script>

    const wheel = document.getElementById('wheel');

    const spinBtn = document.getElementById('spin-btn');

    const winnerText = document.getElementById('winner');



    const contestants = JSON.parse(localStorage.getItem('raffleContestants') || '[]');



    if (contestants.length < 2) {

      spinBtn.disabled = true;

      winnerText.textContent = "Need at least 2 participants to spin.";

    }



    const colors = ['#FF5733', '#33B5FF', '#FF33C4', '#75FF33', '#FFD133', '#33FFF3'];

    const angle = 360 / contestants.length;



    contestants.forEach((person, i) => {

      const seg = document.createElement('div');

      seg.className = 'segment';

      seg.style.background = colors[i % colors.length];

      seg.style.transform = `rotate(${i * angle}deg) skewY(-${90 - angle}deg)`;

      seg.textContent = person.name;

      wheel.appendChild(seg);

    });



    spinBtn.addEventListener('click', () => {

      const spin = 360 * 5 + Math.floor(Math.random() * 360);

      wheel.style.transform = `rotate(${spin}deg)`;



      setTimeout(() => {

        const final = spin % 360;

        const index = Math.floor((360 - final) / angle) % contestants.length;

        winnerText.textContent = `🎉 Winner: ${contestants[index].name} 🎉`;

      }, 5200);

    });

  </script>

</body>

</html>
