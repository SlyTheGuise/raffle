<!DOCTYPE html>
<html>
<head>
  <title>Live Spin</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <style>
    body { text-align: center; }
    #wheel { width: 300px; height: 300px; border-radius: 50%; margin: auto; border: 5px solid #333; }
    .winner { font-size: 1.5em; color: green; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Live Raffle Spin</h2>
  <div id="wheel"></div>
  <div class="winner" id="winner"></div>

 <script>
  function submitForm() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();

    if (!name || !email) {
      alert("Fill in all fields");
      return;
    }

    db.ref("contestants").push({ name, email })
      .then(() => {
        localStorage.setItem("joinedName", name); // store name temporarily
        window.location.href = "spin.html";
      });
  }
</script>
</body>
</html>
